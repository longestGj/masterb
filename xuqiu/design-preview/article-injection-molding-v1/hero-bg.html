<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Injection molding hero background</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; background: #26372B; overflow: hidden; }
  svg { width: 1600px; height: 900px; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line drawing of an injection molding machine">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D0F090"/>
    </marker>
  </defs>

  <!-- soft structural bands, flat only -->
  <rect x="0" y="0" width="1600" height="900" fill="#26372B"/>
  <rect x="600" y="0" width="1" height="900" fill="#D0F090" opacity="0.10"/>
  <rect x="0" y="795" width="1600" height="1" fill="#FFFFFF" opacity="0.06"/>

  <g transform="translate(0,20) scale(0.9)">
  <g fill="none" stroke="#D0F090" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <!-- hopper -->
    <path d="M820 170 H980 L940 330 H860 Z"/>
    <path d="M885 330 V365 M915 330 V365"/>
    <!-- barrel -->
    <rect x="660" y="365" width="620" height="105" rx="14"/>
    <!-- screw -->
    <path d="M690 417 H1255"/>
    <path d="M720 390 L748 445 M765 390 L793 445 M810 390 L838 445 M855 390 L883 445 M900 390 L928 445 M945 390 L973 445 M990 390 L1018 445 M1035 390 L1063 445 M1080 390 L1108 445 M1125 390 L1153 445 M1170 390 L1198 445 M1215 390 L1243 445"/>
    <!-- nozzle -->
    <path d="M1280 395 L1360 420 V430 L1280 455 Z"/>
    <path d="M1360 425 H1435" marker-end="url(#ar)"/>
    <!-- fixed platen -->
    <rect x="1435" y="285" width="32" height="265" rx="5"/>
    <!-- moving platen -->
    <rect x="1570" y="285" width="32" height="265" rx="5"/>
    <!-- tie bars -->
    <path d="M1602 330 H1740 M1602 500 H1740" opacity="0.6"/>
    <!-- clamp arrow -->
    <path d="M1730 417 H1610" marker-end="url(#ar)" opacity="0.7"/>
  </g>

  <!-- heater bands -->
  <g fill="#D0F090" opacity="0.35">
    <rect x="730" y="354" width="38" height="9" rx="2"/>
    <rect x="820" y="354" width="38" height="9" rx="2"/>
    <rect x="910" y="354" width="38" height="9" rx="2"/>
    <rect x="1000" y="354" width="38" height="9" rx="2"/>
    <rect x="1090" y="354" width="38" height="9" rx="2"/>
    <rect x="1180" y="354" width="38" height="9" rx="2"/>
    <rect x="730" y="471" width="38" height="9" rx="2"/>
    <rect x="820" y="471" width="38" height="9" rx="2"/>
    <rect x="910" y="471" width="38" height="9" rx="2"/>
    <rect x="1000" y="471" width="38" height="9" rx="2"/>
    <rect x="1090" y="471" width="38" height="9" rx="2"/>
    <rect x="1180" y="471" width="38" height="9" rx="2"/>
  </g>

  <!-- pellets -->
  <g fill="#F6F8F4" opacity="0.6">
    <circle cx="870" cy="205" r="6"/>
    <circle cx="905" cy="220" r="6"/>
    <circle cx="940" cy="205" r="6"/>
    <circle cx="888" cy="250" r="6"/>
    <circle cx="925" cy="265" r="6"/>
    <circle cx="900" cy="298" r="6"/>
    <circle cx="942" cy="292" r="6"/>
  </g>

  <!-- molded part -->
  <rect x="1483" y="385" width="70" height="60" rx="5" fill="#101C15" stroke="#D0F090" stroke-width="3"/>

  <!-- flow arrows -->
  <g fill="none" stroke="#D0F090" stroke-width="2.6" stroke-linecap="round" opacity="0.7">
    <path d="M900 332 V360" marker-end="url(#ar)"/>
  </g>
  </g>

  <!-- faint technical grid at left edge -->
  <g stroke="#D0F090" opacity="0.08">
    <path d="M80 200 H240 M80 220 H240 M80 240 H240 M80 260 H240"/>
  </g>
</svg>
</body>
</html>
