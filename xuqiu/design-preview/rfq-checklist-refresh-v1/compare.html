<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RFQ Checklist Current vs Proposed</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; background: #f6f8f4; font: 14px/1.5 Arial, sans-serif; }
    h1 { margin: 0 0 4px; }
    p { margin: 0 0 20px; color: #68736e; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    figure { margin: 0; padding: 10px; background: #fff; border: 1px solid #d8ded9; }
    figcaption { padding: 4px 2px 10px; font-weight: 700; }
    img { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <h1>RFQ Checklist: current vs proposed</h1>
  <p>Left: generic Resources template. Right: proposed field checklist with progress sections.</p>
  <div class="grid">
    <figure>
      <figcaption>Current</figcaption>
      <img src="output/current-desktop-1440.png" alt="Current RFQ Checklist page">
    </figure>
    <figure>
      <figcaption>Proposed</figcaption>
      <img src="output/proposed-desktop-1440.png" alt="Proposed RFQ Checklist page">
    </figure>
  </div>
</body>
</html>
